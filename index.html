<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Pirate Jump: Parrot Power</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="score-ui">Height: <span id="current-height">0</span><br>Gold: <span id="current-gold">0</span></div>
        
        <div id="ui-overlay">
            <h1 id="menu-title">PIRATE JUMP</h1>
            <button id="start-btn" class="btn">SET SAIL</button>
            <button id="open-shop-btn" class="btn">SHOP</button>
        </div>

        <div id="game-over-overlay" style="display:none; text-transform: uppercase;">
            <div id="game-over-content">
                <h1 style="color: #ff3b30; margin-bottom: 30px; font-size: 32px; text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;">OVERBOARD! ☠️</h1>
                
                <div id="new-high-score-form" style="display:none; margin-bottom: 20px; padding: 15px; border: 2px solid gold; border-radius: 5px; background: rgba(0,0,0,0.8);">
                    <p style="color: #ffb300; font-size: 16px; margin: 0 0 10px 0; font-weight: bold; animation: pulse 1s infinite;">NEW HIGH SCORE!</p>
                    <input type="text" id="hs-name-input" placeholder="Enter Pirate Name" maxlength="15" style="padding: 10px; font-size: 14px; text-align: center; border: 2px solid #5d4037; background: #ffe0b2; color: #3e2723; border-radius: 5px; width: 180px;">
                    <br><button id="hs-submit-btn" class="btn" style="background: #e64a19; color: white; padding: 8px 16px; margin-top: 10px;">SAVE NAME</button>
                </div>

                <div id="game-over-stats">
                    <p style="margin: 15px 0; font-size: 16px; color: gold; text-shadow: 1px 1px #000;">Height Reached: <span id="go-score" style="color: white;">0</span></p>
                    <p style="margin: 15px 0; font-size: 16px; color: gold; text-shadow: 1px 1px #000;">Record: <span id="go-high-score" style="color: white;">0</span></p>
                    <p style="margin: 15px 0; font-size: 14px; color: #aaa;">Held By: <span id="go-score-holder" style="color: #fff;">Pirate</span></p>
                    
                    <div style="margin: 20px 0; padding: 10px; background: rgba(0,0,0,0.5); border: 2px dashed #5d4037; border-radius: 5px; cursor: pointer;" id="change-name-text">
                        <span style="font-size: 12px; color: #fff;">Playing As:</span><br>
                        <span id="go-your-name" style="color: #ffb300; font-size: 18px; margin: 5px 0; display: inline-block;">Pirate</span><br>
                        <span style="font-size: 10px; color: #a1887f;">(Click Identity To Change)</span>
                    </div>
                </div>
                <br>
                <button id="play-again-btn" class="btn" style="background: #e64a19; color: white; border-radius: 5px; font-size: 16px; padding: 12px 24px; box-shadow: inset 0 0 10px #000;">SAIL AGAIN</button>
                <br><br>
                <button id="go-shop-btn" class="btn" style="background: #3e2723; color: white; border-radius: 5px; font-size: 14px; padding: 10px 20px; box-shadow: inset 0 0 10px #000;">SKIN SHOP</button>
            </div>
        </div>

        <div id="shop-overlay" style="display:none;">
            <h2>SKIN SHOP</h2>
            <div id="shop-list"></div>
            <button class="btn" onclick="closeShop()" style="background:#d32f2f">CLOSE</button>
        </div>
    </div>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
